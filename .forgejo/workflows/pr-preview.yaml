name: PR preview deploy

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]

concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-latest
    env:
      IMAGE: forgejo.sindres.no/nvbf/beachvolleyball-scoreboard
      REPO: nvbf/beachvolleyball-scoreboard
      PR: ${{ github.event.pull_request.number }}
    steps:
      # Always checked out, even on `closed` -- the notify step below needs
      # .forgejo/scripts/notify-preview.mjs to exist in the workspace
      # regardless of action type. Only the image build is skipped on closed.
      - name: Checkout
        uses: https://data.forgejo.org/actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Write registry auth for Kaniko
        if: ${{ github.event.action != 'closed' }}
        run: |
          mkdir -p "${{ github.workspace }}/.docker-config"
          AUTH=$(printf '%s:%s' "${{ secrets.REGISTRY_USER }}" "${{ secrets.REGISTRY_TOKEN }}" | base64 -w0)
          printf '{"auths":{"forgejo.sindres.no":{"auth":"%s"}}}' "$AUTH" \
            > "${{ github.workspace }}/.docker-config/config.json"

      # Kaniko builds without a Docker daemon/socket in the job container --
      # this runner serves ~15 other repos, so we deliberately avoid needing
      # privileged/docker-socket-mounted job containers for this one pipeline.
      - name: Build and push image (Kaniko)
        if: ${{ github.event.action != 'closed' }}
        uses: docker://gcr.io/kaniko-project/executor:v1.23.2
        env:
          DOCKER_CONFIG: ${{ github.workspace }}/.docker-config
        with:
          args: >-
            --context=dir://${{ github.workspace }}
            --dockerfile=${{ github.workspace }}/Dockerfile
            --destination=${{ env.IMAGE }}:pr-${{ env.PR }}
            --destination=${{ env.IMAGE }}:pr-${{ env.PR }}-${{ github.sha }}

      - name: Notify preview-deploy receiver
        run: node .forgejo/scripts/notify-preview.mjs
        env:
          PREVIEW_WEBHOOK_URL: https://preview-deploy.dev.sindres.no/webhook
          PREVIEW_WEBHOOK_SECRET: ${{ secrets.PREVIEW_WEBHOOK_SECRET }}
          REPO: nvbf/beachvolleyball-scoreboard
          ACTION: ${{ github.event.action }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BRANCH: ${{ github.event.pull_request.head.ref }}
          IMAGE: ${{ env.IMAGE }}:pr-${{ env.PR }}

      - name: Comment preview URL on PR
        if: ${{ github.event.action != 'closed' }}
        run: node .forgejo/scripts/comment-preview-url.mjs
        env:
          FORGEJO_API_TOKEN: ${{ secrets.FORGEJO_API_TOKEN }}
          REPO: nvbf/beachvolleyball-scoreboard
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BRANCH: ${{ github.event.pull_request.head.ref }}
